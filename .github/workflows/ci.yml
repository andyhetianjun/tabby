name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check that the web build works
        run: npx expo export --platform web
        working-directory: apps/mobile
        env:
          CI: "1"

  api-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tabby
          POSTGRES_PASSWORD: tabby
          POSTGRES_DB: tabby_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tabby"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: API tests against Postgres
        run: npm test -w @tabby/api
        env:
          TEST_DATABASE_URL: postgres://tabby:tabby@localhost:5432/tabby_test
