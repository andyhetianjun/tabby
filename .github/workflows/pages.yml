name: Demo site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the demo (runs in the browser, no server)
        run: npx expo export --platform web --output-dir dist
        working-directory: apps/mobile
        env:
          CI: "1"
          EXPO_PUBLIC_DEMO_ONLY: "1"
          EXPO_BASE_URL: /tabby
      - name: Make unknown paths open the app too
        run: cp dist/index.html dist/404.html
        working-directory: apps/mobile
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/mobile/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
