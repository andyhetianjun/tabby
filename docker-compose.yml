services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tabby
      POSTGRES_PASSWORD: tabby
      POSTGRES_DB: tabby
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tabby"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
